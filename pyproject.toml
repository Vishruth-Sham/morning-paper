[project]
name = "morning-paper"
version = "0.1.0"
description = "A calm, finite personal newspaper that runs on localhost."
requires-python = ">=3.10"
dependencies = [
    "flask>=3.0",
    "requests>=2.31",
    "feedparser>=6.0",
    "beautifulsoup4>=4.12",
    "anthropic>=0.75",
    "tzdata>=2024.1",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
morning-paper = "paper.app:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["paper"]

[tool.setuptools.package-data]
paper = ["templates/*.html", "templates/kinds/*.html", "static/*"]
